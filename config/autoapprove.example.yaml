# config/autoapprove.yaml — standing rules: let the queue pre-decide the
# obvious cases so only real judgment calls reach you (SPEC.md §6.2).
#
# This is the TEMPLATE. Your own copy, config/autoapprove.yaml, is personal and
# gitignored. The setup interview asks for your bar and writes the
# automatic-approval rule below when you say yes; or copy this file and edit it.
#
# Order of evaluation, fixed: deterministic filters → sanity checks → standing
# rules. Rules only see jobs that survived both earlier layers (status queued).
# Never duplicate a sanity-layer control here (remote conflict, commute,
# underpriced belong to remote_policy / comp_sanity in filters.yaml).
#
# For each queued job, every auto_reject rule is tried first, then every
# auto_approve rule; the first rule whose `when` matches decides.
#   auto_reject:  the job is rejected (layer standing_rule), logged with the
#                 rule's reason, reviewable — never silently dropped.
#   auto_approve: the job is approved without asking you: tailored and its
#                 form filled by the daily run for you to review (opened for
#                 you at the end of the run when staging.open_after_daily_run
#                 is true in filters.yaml). Nothing is submitted: you click
#                 submit.
#
# Conditions in `when` (all must hold):
#   tier: 1|2|3               company tier from targets.yaml
#   score_gte: N / score_lt: N    fit score 0-100
#   sanity_flags: none        no sanity flag at all on the job
#   blocking_flags: none      no sanity flag that is a deal-breaker: by default a
#                             doubt about remote work or the location
#                             (remote-conflict, remote-policy-unclear,
#                             hybrid-office-unknown, geo, office-days, onsite) or
#                             pay that is not realistic (ote-unrealistic). A
#                             missing range, role sprawl, an unclear base-vs-OTE
#                             basis or a wide range does not hold a job back.
#                             The lists are `auto_approve` in filters.yaml; a
#                             flag in neither list (such as underpriced) blocks.
#   location_known: true      the remote check ran and where the work happens is
#                             clear: neither what the posting states nor what
#                             its fine print implies is "unclear"
#   employer_posting: true    the employer's own Greenhouse/Lever/Ashby posting,
#                             not a job-feed row whose employer posting was not
#                             found (that one has no form to fill; it waits in
#                             your queue marked "apply on the employer's site"),
#                             nor a job on a stale board or a listed repost site
#                             (registries/reposters.yml)
#                             location_known and employer_posting hold for
#                             every rule, written or not: no rule approves a job
#                             whose location is unclear or that has no employer
#                             posting; it waits in your queue
#   sanity_checked: true      both sanity checks finished (the remote check and
#                             the comp check); a job whose check failed has no
#                             flags yet, so pair this with sanity_flags: none
#                             or blocking_flags: none
#   friction_lte: N           application-form friction score
#   remote: true|false
#   comp_min_gte: N           published minimum (base; an OTE minimum never matches)
#   comp_max_lt: N            published maximum below N
#   comp_unpublished: true|false
#   title_class: <track id>   the job's role track in filters.yaml; any track
#                             id works (registered_nurse, backend_engineer, ...).
#                             A name that is no track id never matches, and
#                             `jobkit doctor` warns about it. For
#                             account_executive, a founding/first AE title is
#                             not counted.
#   flag_present: "<text>"    a sanity flag containing this text (e.g. "ote-unrealistic")
#   any_of: [ {...}, {...} ]  at least one nested condition set holds

version: "1.0"

# The recommended start (the setup interview writes it on a yes): every job
# that clears your bar (fit score 75 or more), once both sanity checks have
# run, with no deal-breaker flag, a clear location and the employer's own
# posting, is approved and its form filled for you. Raise or lower the score
# to move your bar. Delete the rule to approve every job yourself.
auto_approve:
  - when: { score_gte: 75, sanity_checked: true, blocking_flags: none,
            location_known: true, employer_posting: true }
    reason: "clears-your-bar"
  # More examples:
  # - when: { tier: 1, score_gte: 80, sanity_flags: none, friction_lte: 40 }
  #   reason: "tier1-quick-apply"
  # - when: { score_gte: 90, remote: true, comp_min_gte: 200000 }
  #   reason: "remote-high-base"

auto_reject: []
  # Examples — uncomment and adjust. Every company a job feed, LinkedIn
  # discovery or a pasted link adds is tier 3, so a tier-3 rule also applies
  # to every feed job, and can override a track's lower min_score:
  # - when: { tier: 3, score_lt: 70 }
  #   reason: "tier3-below-bar"
  # - when: { tier: 2, score_lt: 70 }
  #   reason: "tier2-weak-fit"
  # - when: { title_class: my_role, comp_max_lt: 60000 }
  #   reason: "low-comp"

# Optional daily limit on automatic approvals. There is none unless you set
# one. With it, the best-scoring jobs are approved first and the rest wait in
# your queue for the next day's run.
# max_auto_approve_per_day: 10
