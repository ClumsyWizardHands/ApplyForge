# TEST PROFILE — not a template. tests/conftest.py copies tests/fixtures/config/
# into every test sandbox as config/, so the suite runs on a fresh clone with no
# personal config. The values are the settings the tests were written against,
# as the fictional example user, Jordan Rivera, would set them.
# For your own setup, run the setup interview or copy config/banned_phrases.example.yaml.

version: "1.3"

cover_letter:
  hard_reject:
    - "excited to apply"
    - "thrilled to apply"
    - "passionate about"
    - "fast-paced environment"
    - "align with your mission"
    - "aligns with my values"
    - "leverage my skills"
    - "proven track record"
    - "wear many hats"
    - "hit the ground running"
    - "perfect fit"
    - "I believe I would be"
    - "as you can see from my resume"
    - "I would love the opportunity"
    - "thank you for your time and consideration"
  hard_reject_patterns:
    - name: "contrast construction"
      regex: "\\bI(?:['’]d| would) rather\\b[^.!?]{0,160}?\\bthan\\b"
    - name: "gap announcement"
      regex: "\\bhonest (?:about (?:the|my) )?gap\\b"
    - name: "apologetic gap close"
      regex: "\\bif (?:that|this|it)\\b[^.!?]{0,60}?\\bdisqualif"
    - name: "candor preface"
      regex: "\\blet me be (?:candid|frank|blunt|transparent)\\b"
    - name: "title-never-held confession"
      regex: "\\bI(?:['’]ve| have) never held\\b|\\bI haven['’]?t (?:ever )?held\\b"
  soft_flag:
    - "deeply"
    - "truly"
    - "incredibly"
    - "journey"
    - "space"
    - "at the intersection of"

resume:
  hard_reject:
    - "spearheaded"
    - "orchestrated"
    - "championed"
    - "utilized"
    - "leveraged"
    - "results-driven"
    - "detail-oriented"
    - "team player"
    - "dynamic professional"
    - "cross-functional synergies"
    - "best-in-class"
    - "actionable insights"
    - "instrumental in"
    - "played a key role in"
    - "responsible for"
    - "helped to"
  soft_flag:
    - "robust"
    - "seamless"
    - "holistic"
    - "streamlined"
    - "optimized"
    - "innovative"
    - "strategic"

structural:
  bullet_length_stdev_min_pct: 0.15
  max_bullets_per_verb_class: 2
  em_dashes_per_100_words_max: 1.5
  semicolons_per_100_words_max: 1.0
  sentence_length_stdev_min: 5.0
  max_stacked_adjectives: 2
  company_swap_test: true

cross_letter:
  enabled: true
  phrase_words: 5
  min_prior_letters: 2
  lookback_letters: 50
  on_repeat: fail

drift:
  similarity_threshold: 0.75
  on_drift: revert_to_source
  estimate_style: confident
  flag_new_content_words: true

critic:
  enabled: true
  max_regenerations: 2
  allow_clean_pass: true
